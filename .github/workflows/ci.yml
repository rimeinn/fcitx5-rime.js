name: ci

on:
  push:
    branches:
      - master
    tags:
      - '[0-9]+.*'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 26.x

      - name: Install dependencies
        run: |
          sudo apt install -y --no-install-recommends \
            gettext
          npm i -g pnpm
          pnpm i
          ./scripts/install-deps.sh

      - name: Get emscripten version
        run: |
          echo "EMSCRIPTEN_VERSION=$(cat fcitx5-js/.emscripten-version)" >> $GITHUB_ENV

      - name: Setup emsdk
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}

      - name: Build
        run: |
          pnpm run configure
          pnpm run build
          npm pack
          mv fcitx5-rime-*.tgz fcitx5-rime.tgz

      - name: Build rime-ice
        uses: rimeinn/deploy-schema@master
        with:
          user-recipe-list: |-
            iDvel/rime-ice:others/recipes/full
          shared-recipe-list:
          package-items: |-
            build
            lua
            opencc
            custom_phrase.txt

      - name: Build demo
        run: |
          cd demo
          mv /tmp/deploy-schema/artifact.zip public/rime-ice.zip
          pnpm i
          pnpm run build
          mkdir rime-ice
          mv dist rime-ice # Wrap a directory for artifact

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rime-ice
          path: |
            demo/rime-ice

      - name: Setup tmate session
        if: ${{ failure() }}
        uses: mxschmitt/action-tmate@v3

      - name: Create nightly release
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: 'marvinpinto/action-automatic-releases@latest'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: latest
          prerelease: true
          title: "Nightly Build"
          files: |
            fcitx5-rime.tgz

      - name: Create stable release
        if: ${{ github.ref_type == 'tag' }}
        uses: 'marvinpinto/action-automatic-releases@latest'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          prerelease: false
          title: ${{ github.ref_name }}
          files: |
            fcitx5-rime.tgz
